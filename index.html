<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>The Fart Button</title>
        <link rel="stylesheet" href="./style.css" />
        <script src="https://unpkg.com/konami"></script>
    </head>
    <body>
        <span id="exp-value-container">0</span>

        <div id="fart-loader-container">
            <div id="fart-loader-progress-bar"></div>
        </div>

        <main id="scene">
            <div class="button-container">
                <div id="button-position">
                    <button id="the-fart-button" alt="Fart">Fart</button>
                </div>
            </div>

            <footer>
                <p>Total farts: <span id="total-fart-counter">0</span></p>
            </footer>
        </main>

        <div id="rick">
            <img src="./images/rickroll.gif" alt="Not Pickle Rick. Rick Astley." />
        </div>

        <script type="text/javascript" src="./script.js" defer></script>

    </body>
</html>
