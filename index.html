<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>The Fart Button</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div id="fart-loader-container">
            <div id="fart-loader-progress-bar"></div>
        </div>

        <main id="scene">
            <div class="button-container">
                <div id="button-position">
                    <button id="the-fart-button" alt="Fart">Fart</button>
                </div>
            </div>

            <footer>
                <p>Total farts: <span id="total-fart-counter">0</span></p>
            </footer>
        </main>

        <div id="rick">
            <img src="./images/rickroll.gif" alt="Not Pickle Rick. Rick Astley." />
        </div>

        <section id="game-over">
            <div>
                <h1>GAME OVER</h1>
                <h2>Some reason for the game over</h2>
                <button class="new-game-button">New game</button>
            </div>
        </section>

        <script type="module" src="./script.js" defer></script>

    </body>
</html>
